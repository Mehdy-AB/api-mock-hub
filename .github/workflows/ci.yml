name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Install web UI dependencies
        run: npm ci --prefix client

      - name: Test server
        run: npm test

      - name: Build web UI and server
        run: npm run build

      - name: Validate example import files
        run: npm run validate-import -- examples/01-single-endpoint.json examples/02-orders-crud.json examples/03-auth-and-errors.json examples/04-openapi-petstore.json examples/05-orders-update.json examples/sample-import.json
